name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # App runtime retained at Node 20 until Expo SDK 51 baseline tests are repaired and Node 24 compatibility is verified.
          node-version: 20
          cache: 'npm'
      - run: npm ci || npm i
      - run: npx expo-cli --version || npx expo --version
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo doctor || echo "expo doctor skipped"
