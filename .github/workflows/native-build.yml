name: Native build validation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-build.yml'
      - 'app/**'
      - 'components/**'
      - 'src/**'
      - 'app.json'
      - 'metro.config.js'
      - 'package.json'
      - 'package-lock.json'

concurrency:
  group: native-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    name: Android debug compilation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate Android project
        run: npx expo prebuild --clean --no-install --platform android
      - name: Compile unsigned Android debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

  ios:
    name: iOS simulator compilation
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generate iOS project
        run: npx expo prebuild --clean --no-install --platform ios
      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios
      - name: Compile unsigned iOS simulator app
        run: >-
          xcodebuild
          -workspace ios/NeuroPilot.xcworkspace
          -scheme NeuroPilot
          -configuration Debug
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
